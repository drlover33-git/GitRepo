<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎪 사다리 게임</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff9f0;
      --card: #ffffff;
      --primary: #ff6b6b;
      --secondary: #ffd93d;
      --accent: #6bcb77;
      --blue: #4d96ff;
      --purple: #c77dff;
      --text: #2d2d2d;
      --muted: #888;
      --border: #ffe0c3;
      --shadow: 0 8px 32px rgba(255,107,107,0.13);
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nanum Gothic', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      background-image:
        radial-gradient(circle at 15% 15%, #ffe0c344 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, #c3e6ff44 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #ffd93d22 0%, transparent 60%);
    }
    h1, h2, h3, .label { font-family: 'Jua', sans-serif; }

    /* ── layout ── */
    .app { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
    header {
      text-align: center;
      padding: 32px 0 24px;
    }
    header h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      color: var(--primary);
      letter-spacing: -1px;
      text-shadow: 3px 3px 0 #ffd93d;
    }
    header p { color: var(--muted); font-size: .95rem; margin-top: 6px; }

    /* ── card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 28px 32px;
      margin-bottom: 24px;
      border: 2px solid var(--border);
    }
    .card-title {
      font-size: 1.15rem;
      color: var(--primary);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── section tabs ── */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .tab-btn {
      padding: 8px 20px;
      border-radius: 50px;
      border: 2px solid var(--border);
      background: white;
      font-family: 'Jua', sans-serif;
      font-size: .95rem;
      cursor: pointer;
      transition: all .2s;
      color: var(--muted);
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .tab-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

    /* ── number input ── */
    .num-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .num-row label { font-family: 'Jua', sans-serif; font-size: 1rem; min-width: 90px; }
    .num-ctrl {
      display: flex;
      align-items: center;
      gap: 0;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .num-ctrl button {
      width: 36px; height: 36px;
      border: none; background: #fff4ea;
      font-size: 1.2rem; cursor: pointer;
      font-family: 'Jua', sans-serif;
      color: var(--primary);
      transition: background .15s;
    }
    .num-ctrl button:hover { background: var(--secondary); }
    .num-ctrl span {
      width: 44px; text-align: center;
      font-family: 'Jua', sans-serif;
      font-size: 1.1rem;
      color: var(--text);
    }

    /* ── name/result inputs ── */
    .names-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .name-input-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .char-badge {
      font-size: 1.6rem;
      background: #fff4ea;
      border-radius: 50%;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border: 2px solid var(--border);
      transition: transform .15s, border-color .15s;
      user-select: none;
    }
    .char-badge:hover { transform: scale(1.2); border-color: var(--primary); }
    .name-input, .result-input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 10px;
      border: 2px solid var(--border);
      font-family: 'Nanum Gothic', sans-serif;
      font-size: .88rem;
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }
    .name-input:focus, .result-input:focus { border-color: var(--primary); }

    /* ── character picker modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.38);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      max-width: 360px;
      width: 92%;
      box-shadow: 0 24px 60px rgba(0,0,0,.18);
      transform: translateY(20px);
      transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 14px; }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .emoji-opt {
      font-size: 1.5rem;
      border-radius: 10px;
      padding: 6px;
      cursor: pointer;
      text-align: center;
      border: 2px solid transparent;
      transition: all .15s;
      background: #fff4ea;
    }
    .emoji-opt:hover { border-color: var(--primary); transform: scale(1.2); }

    /* ── start button ── */
    .btn-start {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), #ff9f43);
      color: white;
      border: none;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255,107,107,.4);
      transition: transform .15s, box-shadow .15s;
      letter-spacing: 1px;
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,107,107,.5); }
    .btn-start:active { transform: translateY(0); }

    /* ── game canvas area ── */
    #game-section { display: none; }
    #game-section.visible { display: block; }

    .ladder-wrap {
      position: relative;
      overflow-x: auto;
      padding-bottom: 12px;
    }
    #ladder-canvas {
      display: block;
      margin: 0 auto;
      border-radius: 16px;
    }

    /* ── animate button ── */
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .btn-action {
      flex: 1;
      padding: 12px 18px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all .2s;
      background: white;
      color: var(--text);
    }
    .btn-action.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
      box-shadow: 0 4px 14px rgba(77,150,255,.35);
    }
    .btn-action.secondary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .btn-action.reset { background: #f8f8f8; }
    .btn-action:hover { transform: translateY(-2px); }

    /* ── results ── */
    #results-list {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .result-card {
      background: white;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .4s, transform .4s;
    }
    .result-card.show { opacity: 1; transform: translateY(0); }
    .result-card .rc-char { font-size: 2rem; }
    .result-card .rc-name { font-family: 'Jua', sans-serif; font-size: .95rem; margin: 4px 0 2px; }
    .result-card .rc-arrow { color: var(--muted); font-size: .8rem; }
    .result-card .rc-result {
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      color: var(--primary);
      margin-top: 2px;
    }
    .result-card.winner { border-color: var(--secondary); background: #fffbe6; }

    /* ── speed selector ── */
    .speed-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 12px; flex-wrap: wrap;
    }
    .speed-row label { font-family: 'Jua', sans-serif; font-size: .9rem; }
    .speed-btn {
      padding: 5px 14px;
      border-radius: 50px;
      border: 2px solid var(--border);
      background: white;
      font-family: 'Jua', sans-serif;
      font-size: .85rem;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
    }
    .speed-btn.active { background: var(--purple); border-color: var(--purple); color: white; }

    @media (max-width: 600px) {
      .card { padding: 18px 14px 22px; }
      .names-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎪 사다리 게임</h1>
    <p>두근두근! 사다리를 타고 운명을 결정해봐요 🎉</p>
  </header>

  <!-- Setup Card -->
  <div class="card" id="setup-card">
    <div class="card-title">⚙️ 게임 설정</div>

    <div class="num-row">
      <label>👥 인원수</label>
      <div class="num-ctrl">
        <button onclick="changeCount('players',-1)">−</button>
        <span id="player-count">4</span>
        <button onclick="changeCount('players',1)">+</button>
      </div>
      <span style="color:var(--muted);font-size:.85rem">명 (2~10)</span>
    </div>

    <div class="num-row">
      <label>🎯 결과수</label>
      <div class="num-ctrl">
        <button onclick="changeCount('results',-1)">−</button>
        <span id="result-count">4</span>
        <button onclick="changeCount('results',1)">+</button>
      </div>
      <span style="color:var(--muted);font-size:.85rem" id="result-hint">인원수와 동일</span>
    </div>

    <div style="margin-top:22px">
      <div class="card-title">🙋 참가자 이름 & 캐릭터</div>
      <div class="names-grid" id="players-grid"></div>
    </div>

    <div style="margin-top:22px">
      <div class="card-title">🏆 결과 항목</div>
      <div class="names-grid" id="results-grid"></div>
    </div>

    <button class="btn-start" style="margin-top:28px" onclick="startGame()">🚀 게임 시작!</button>
  </div>

  <!-- Game Card -->
  <div class="card" id="game-section">
    <div class="card-title">🎮 사다리 게임 진행 중</div>
    <div class="ladder-wrap">
      <canvas id="ladder-canvas"></canvas>
    </div>
    <div class="speed-row">
      <label>⚡ 속도:</label>
      <button class="speed-btn" onclick="setSpeed(3)">느리게</button>
      <button class="speed-btn active" onclick="setSpeed(6)">보통</button>
      <button class="speed-btn" onclick="setSpeed(12)">빠르게</button>
      <button class="speed-btn" onclick="setSpeed(99)">즉시</button>
    </div>
    <div class="btn-row">
      <button class="btn-action primary" id="btn-reveal-all" onclick="revealAll()">🎲 전체 결과 공개</button>
      <button class="btn-action secondary" id="btn-reveal-one" onclick="revealOne()">👆 한 명씩 공개</button>
      <button class="btn-action reset" onclick="resetGame()">🔄 다시 설정</button>
    </div>
    <div id="results-list"></div>
  </div>
</div>

<!-- Character Picker Modal -->
<div class="modal-overlay" id="char-modal" onclick="closeModal(event)">
  <div class="modal">
    <h3>🎨 캐릭터 선택</h3>
    <div class="emoji-grid" id="emoji-grid"></div>
  </div>
</div>

<script>
const EMOJIS = [
  '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯',
  '🦁','🐮','🐸','🐵','🐔','🐧','🐦','🦄','🦋','🐢',
  '🦖','🦕','🐙','🦑','🦀','🐡','🐠','🐟','🦈','🐳',
  '🌸','🌻','🌈','⭐','🌙','☀️','🍎','🍊','🍋','🍇',
  '🍉','🍓','🥝','🍄','🎃','👻','🤖','👽','🎅','🧸',
  '🦸','🧙','🧜','🧚','🎩','👑','💎','🔮','🎵','🎮'
];

const COLORS = ['#ff6b6b','#4d96ff','#6bcb77','#ffd93d','#c77dff','#ff9f43','#00d2d3','#ff6348','#2ed573','#eccc68'];

// State
let state = {
  playerCount: 4,
  resultCount: 4,
  players: [],
  results: [],
  ladderData: null,
  paths: [],
  animating: false,
  revealedIdx: [],
  speed: 6,
  currentPickTarget: null
};

// ── Setup ──
function changeCount(type, delta) {
  if (type === 'players') {
    state.playerCount = Math.min(10, Math.max(2, state.playerCount + delta));
    document.getElementById('player-count').textContent = state.playerCount;
    // auto-sync result count if equal
    if (state.resultCount === state.playerCount - delta) {
      state.resultCount = state.playerCount;
      document.getElementById('result-count').textContent = state.resultCount;
    }
  } else {
    state.resultCount = Math.min(10, Math.max(2, state.resultCount + delta));
    document.getElementById('result-count').textContent = state.resultCount;
  }
  const hint = document.getElementById('result-hint');
  hint.textContent = state.resultCount === state.playerCount ? '인원수와 동일' : '';
  renderSetupGrids();
}

const defaultNames = ['🙋 참가자1','🙋 참가자2','🙋 참가자3','🙋 참가자4','🙋 참가자5','🙋 참가자6','🙋 참가자7','🙋 참가자8','🙋 참가자9','🙋 참가자10'];
const defaultResults = ['🥇 1등','💤 꽝','🎁 선물','😅 벌칙','🏅 2등','🍕 치킨','☕ 커피','🎤 노래','💸 계산','🎯 도전'];

function renderSetupGrids() {
  // ensure arrays sized
  while (state.players.length < state.playerCount)
    state.players.push({ name: defaultNames[state.players.length] || `참가자${state.players.length+1}`, char: EMOJIS[state.players.length % EMOJIS.length] });
  while (state.results.length < state.resultCount)
    state.results.push({ name: defaultResults[state.results.length] || `결과${state.results.length+1}` });

  const pg = document.getElementById('players-grid');
  pg.innerHTML = '';
  for (let i = 0; i < state.playerCount; i++) {
    const p = state.players[i];
    pg.innerHTML += `
      <div class="name-input-wrap">
        <div class="char-badge" title="캐릭터 변경" onclick="openCharPicker(${i})">${p.char}</div>
        <input class="name-input" value="${escHtml(p.name)}" oninput="state.players[${i}].name=this.value" placeholder="이름" />
      </div>`;
  }

  const rg = document.getElementById('results-grid');
  rg.innerHTML = '';
  for (let i = 0; i < state.resultCount; i++) {
    const r = state.results[i];
    rg.innerHTML += `
      <div class="name-input-wrap">
        <div style="font-size:1.3rem;margin-bottom:2px">🎯</div>
        <input class="result-input" value="${escHtml(r.name)}" oninput="state.results[${i}].name=this.value" placeholder="결과" />
      </div>`;
  }
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Character Picker ──
function openCharPicker(idx) {
  state.currentPickTarget = idx;
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = EMOJIS.map(e => `<div class="emoji-opt" onclick="pickChar('${e}')">${e}</div>`).join('');
  document.getElementById('char-modal').classList.add('open');
}
function pickChar(e) {
  if (state.currentPickTarget !== null) {
    state.players[state.currentPickTarget].char = e;
    renderSetupGrids();
  }
  document.getElementById('char-modal').classList.remove('open');
}
function closeModal(ev) {
  if (ev.target.id === 'char-modal') document.getElementById('char-modal').classList.remove('open');
}

// ── Ladder Generation ──
function generateLadder(n, rungs) {
  // rungs per column between players
  const cols = n - 1;
  const rows = rungs;
  // grid[col][row] = true if horizontal bar from col to col+1
  const grid = Array.from({length: cols}, () => Array(rows).fill(false));
  for (let r = 0; r < rows; r++) {
    let c = 0;
    while (c < cols) {
      if (Math.random() < 0.45) {
        grid[c][r] = true;
        c += 2; // no adjacent
      } else c++;
    }
  }
  return grid;
}

function computePaths(n, grid, rows) {
  const paths = [];
  for (let start = 0; start < n; start++) {
    let col = start;
    const path = [{ col, row: -1 }];
    for (let r = 0; r < rows; r++) {
      // check right
      if (col < n-1 && grid[col][r]) {
        col++;
      } else if (col > 0 && grid[col-1][r]) {
        col--;
      }
      path.push({ col, row: r });
    }
    path.push({ col, row: rows });
    paths.push(path);
  }
  return paths;
}

// Shuffle result assignments based on paths
function assignResults(paths, resultCount, playerCount) {
  const finalCols = paths.map(p => p[p.length-1].col);
  // Build result order: map result index -> result
  const resultIndices = Array.from({length: resultCount}, (_,i) => i);
  // shuffle
  for (let i = resultIndices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [resultIndices[i], resultIndices[j]] = [resultIndices[j], resultIndices[i]];
  }
  return finalCols.map(c => resultIndices[c % resultCount]);
}

// ── Canvas Drawing ──
const RUNG_ROWS = 12;

function setupCanvas() {
  const n = state.playerCount;
  const canvas = document.getElementById('ladder-canvas');
  const colW = 90, padX = 50, padTop = 80, padBottom = 80, rowH = 40;
  const W = padX * 2 + colW * (n - 1) + 60;
  const H = padTop + padBottom + rowH * RUNG_ROWS;
  canvas.width = W;
  canvas.height = H;
  canvas.style.maxWidth = '100%';
  return { canvas, n, colW, padX, padTop, padBottom, rowH, W, H };
}

function colX(col, padX, colW) { return padX + 30 + col * colW; }

function drawLadder(ctx, { n, colW, padX, padTop, padBottom, rowH, W, H }, grid, highlightPaths = [], revealedPlayers = []) {
  ctx.clearRect(0, 0, W, H);

  // background
  ctx.fillStyle = '#fffaf4';
  ctx.fillRect(0, 0, W, H);

  const topY = padTop;
  const botY = H - padBottom;

  // vertical rails
  for (let c = 0; c < n; c++) {
    const x = colX(c, padX, colW);
    ctx.save();
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x, topY);
    ctx.lineTo(x, botY);
    ctx.stroke();
    ctx.restore();
  }

  // horizontal rungs
  for (let c = 0; c < n - 1; c++) {
    for (let r = 0; r < RUNG_ROWS; r++) {
      if (grid[c][r]) {
        const x1 = colX(c, padX, colW);
        const x2 = colX(c + 1, padX, colW);
        const y = topY + (r + 0.5) * rowH;
        ctx.save();
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // highlight paths
  highlightPaths.forEach(({ pathIdx, progress, color }) => {
    const path = state.paths[pathIdx];
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.beginPath();

    // progress: 0..1 over total path segments
    const totalSegs = path.length - 1;
    const drawn = progress * totalSegs;

    for (let s = 0; s < Math.floor(drawn); s++) {
      const a = path[s], b = path[s + 1];
      const ax = colX(a.col, padX, colW), ay = a.row < 0 ? topY - 10 : (a.row >= RUNG_ROWS ? botY + 10 : topY + (a.row + 0.5) * rowH);
      const bx = colX(b.col, padX, colW), by = b.row < 0 ? topY - 10 : (b.row >= RUNG_ROWS ? botY + 10 : topY + (b.row + 0.5) * rowH);
      if (s === 0) ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
    }
    // partial last segment
    const partial = drawn - Math.floor(drawn);
    if (partial > 0 && Math.floor(drawn) < totalSegs) {
      const s = Math.floor(drawn);
      const a = path[s], b = path[s + 1];
      const ax = colX(a.col, padX, colW), ay = a.row < 0 ? topY - 10 : (a.row >= RUNG_ROWS ? botY + 10 : topY + (a.row + 0.5) * rowH);
      const bx = colX(b.col, padX, colW), by = b.row < 0 ? topY - 10 : (b.row >= RUNG_ROWS ? botY + 10 : topY + (b.row + 0.5) * rowH);
      if (Math.floor(drawn) === 0) ctx.moveTo(ax, ay);
      ctx.lineTo(ax + (bx - ax) * partial, ay + (by - ay) * partial);
    }
    ctx.stroke();
    ctx.restore();
  });

  // player labels (top)
  for (let c = 0; c < n; c++) {
    const x = colX(c, padX, colW);
    const p = state.players[c];
    const isRevealed = revealedPlayers.includes(c);

    // circle bg
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, topY - 28, 22, 0, Math.PI * 2);
    ctx.fillStyle = isRevealed ? COLORS[c % COLORS.length] : '#fff4ea';
    ctx.fill();
    ctx.strokeStyle = isRevealed ? COLORS[c % COLORS.length] : '#ffd3b0';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    ctx.font = '18px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.char, x, topY - 28);

    ctx.font = 'bold 12px Nanum Gothic, sans-serif';
    ctx.fillStyle = '#333';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const name = p.name.replace(/^[^\s]*\s/, '').substring(0, 5);
    ctx.fillText(name, x, topY - 4);
  }

  // result labels (bottom)
  for (let c = 0; c < n && c < state.resultCount; c++) {
    const x = colX(c, padX, colW);
    const revealed = revealedPlayers.some(pi => state.paths[pi][state.paths[pi].length-1].col === c);
    const rIdx = state.assignment[c];
    const r = state.results[rIdx];

    ctx.save();
    ctx.beginPath();
    const bw = Math.min(colW - 10, 80);
    roundRect(ctx, x - bw/2, botY + 8, bw, 30, 8);
    ctx.fillStyle = revealed ? '#fff3e0' : '#f5f5f5';
    ctx.fill();
    ctx.strokeStyle = revealed ? '#ffb74d' : '#ddd';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    ctx.font = '11px Nanum Gothic, sans-serif';
    ctx.fillStyle = revealed ? '#e65100' : '#aaa';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const rname = (r ? r.name : '?').substring(0, 6);
    ctx.fillText(rname, x, botY + 23);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Game Start ──
function startGame() {
  // sync names from inputs
  const nameInputs = document.querySelectorAll('#players-grid .name-input');
  nameInputs.forEach((inp, i) => { if (i < state.playerCount) state.players[i].name = inp.value || `참가자${i+1}`; });
  const resultInputs = document.querySelectorAll('#results-grid .result-input');
  resultInputs.forEach((inp, i) => { if (i < state.resultCount) state.results[i].name = inp.value || `결과${i+1}`; });

  const grid = generateLadder(state.playerCount, RUNG_ROWS);
  state.ladderData = grid;
  state.paths = computePaths(state.playerCount, grid, RUNG_ROWS);
  state.assignment = assignResults(state.paths, state.resultCount, state.playerCount);
  state.revealedIdx = [];
  state.animating = false;
  state.animQueue = [];
  state.progressMap = {};

  document.getElementById('setup-card').style.display = 'none';
  const gs = document.getElementById('game-section');
  gs.classList.add('visible');
  document.getElementById('results-list').innerHTML = '';

  const dims = setupCanvas();
  state.dims = dims;
  const ctx = dims.canvas.getContext('2d');
  drawLadder(ctx, dims, grid, [], []);
}

// ── Animation ──
function setSpeed(s) {
  state.speed = s;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function getPathCoord(path, segIdx, frac, dims) {
  const { padX, colW, padTop, padBottom, rowH, H } = dims;
  const topY = padTop, botY = H - padBottom;
  const a = path[segIdx], b = path[segIdx + 1];
  const ax = colX(a.col, padX, colW), ay = a.row < 0 ? topY - 10 : (a.row >= RUNG_ROWS ? botY + 10 : topY + (a.row + 0.5) * rowH);
  const bx = colX(b.col, padX, colW), by = b.row < 0 ? topY - 10 : (b.row >= RUNG_ROWS ? botY + 10 : topY + (b.row + 0.5) * rowH);
  return { x: ax + (bx - ax) * frac, y: ay + (by - ay) * frac };
}

let animFrame = null;
function animatePaths(playerIndices, onDone) {
  if (state.speed >= 99) {
    // instant
    playerIndices.forEach(i => state.revealedIdx.push(i));
    const ctx = state.dims.canvas.getContext('2d');
    drawLadder(ctx, state.dims, state.ladderData, [], state.revealedIdx);
    showResultCards(playerIndices);
    onDone && onDone();
    return;
  }

  const progresses = {};
  playerIndices.forEach(i => progresses[i] = 0);
  const totalSegs = state.paths[0].length - 1;
  const fps = 60;
  const secsPerSeg = 1 / state.speed;

  let last = null;
  function frame(ts) {
    if (!last) last = ts;
    const dt = (ts - last) / 1000;
    last = ts;
    const inc = dt / (secsPerSeg * totalSegs);
    let allDone = true;
    playerIndices.forEach(i => {
      progresses[i] = Math.min(1, progresses[i] + inc);
      if (progresses[i] < 1) allDone = false;
    });

    const ctx = state.dims.canvas.getContext('2d');
    const highlights = playerIndices.map((i, idx) => ({
      pathIdx: i,
      progress: progresses[i],
      color: COLORS[i % COLORS.length]
    }));
    drawLadder(ctx, state.dims, state.ladderData, highlights, state.revealedIdx);

    if (allDone) {
      playerIndices.forEach(i => state.revealedIdx.push(i));
      drawLadder(ctx, state.dims, state.ladderData, [], state.revealedIdx);
      showResultCards(playerIndices);
      state.animating = false;
      onDone && onDone();
    } else {
      animFrame = requestAnimationFrame(frame);
    }
  }
  animFrame = requestAnimationFrame(frame);
}

function revealAll() {
  if (state.animating) return;
  state.animating = true;
  const remaining = [];
  for (let i = 0; i < state.playerCount; i++) {
    if (!state.revealedIdx.includes(i)) remaining.push(i);
  }
  if (!remaining.length) { state.animating = false; return; }
  animatePaths(remaining, () => {});
}

let oneQueue = [];
function revealOne() {
  if (state.animating) return;
  const remaining = [];
  for (let i = 0; i < state.playerCount; i++) {
    if (!state.revealedIdx.includes(i)) remaining.push(i);
  }
  if (!remaining.length) return;
  state.animating = true;
  const pick = remaining[Math.floor(Math.random() * remaining.length)];
  animatePaths([pick], () => { state.animating = false; });
}

function showResultCards(playerIndices) {
  const list = document.getElementById('results-list');
  playerIndices.forEach((pi, idx) => {
    const p = state.players[pi];
    const finalCol = state.paths[pi][state.paths[pi].length - 1].col;
    const rIdx = state.assignment[finalCol];
    const r = state.results[rIdx] || { name: '?' };
    const isWinner = r.name.includes('1등') || r.name.includes('🥇');

    const div = document.createElement('div');
    div.className = 'result-card' + (isWinner ? ' winner' : '');
    div.innerHTML = `
      <div class="rc-char">${p.char}</div>
      <div class="rc-name">${escHtml(p.name.replace(/^[^\s]*\s/,''))}</div>
      <div class="rc-arrow">▼</div>
      <div class="rc-result">${escHtml(r.name)}</div>`;
    list.appendChild(div);
    setTimeout(() => div.classList.add('show'), 80 * idx + 100);
  });
}

function resetGame() {
  document.getElementById('setup-card').style.display = '';
  document.getElementById('game-section').classList.remove('visible');
  document.getElementById('results-list').innerHTML = '';
  if (animFrame) cancelAnimationFrame(animFrame);
  state.animating = false;
  state.revealedIdx = [];
}

// ── Init ──
renderSetupGrids();
</script>
